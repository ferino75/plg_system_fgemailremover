PLG_SYSTEM_FGEMAILREMOVER_FIELD_REPLACEMENT_LABEL="Replacement text"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_LABEL="Replacement mode"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_DESC="Text - the address is replaced with the text/HTML below. Image - the address is rendered as a PNG image (requires GD on the server; falls back to text mode automatically if GD is missing or generation fails)."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_TEXT="Text"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_IMAGE="Image (PNG)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_IMAGE_CLASS_LABEL="Image CSS class"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_IMAGE_CLASS_DESC="CSS class(es) added to the generated <img> tag (space-separated), e.g. to override the template's default image shadow. Leave empty to use only the internal emailremover-img class."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_PATH_LABEL="TTF font path"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_PATH_DESC="Path to a .ttf/.otf file (e.g. uploaded via Media Manager), e.g. /media/fonts/Poppins-Regular.ttf - the image is rendered with this font instead of the default. Leave empty (or if the file doesn't exist, or GD lacks freetype) to use the built-in simple font."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_SIZE_LABEL="Font size (with TTF font)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_SIZE_DESC="Font size in points, only used when a TTF font path is set above."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_REPLACEMENT_DESC="Text (HTML allowed) that replaces a removed email address - applies to both mailto links and plain-text addresses. Leave empty to simply remove the address with no replacement. In 'Image' mode this text is used as the image's alt text (don't put the actual address in it, or it would defeat the point)."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_WHITELIST_LABEL="Exceptions (addresses to keep)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_WHITELIST_DESC="List of email addresses or whole domains that the plugin should leave untouched - one entry per line (or comma-separated). Specific address: e.g. gdpr@example.sk. Whole domain: @example.sk (keeps every address at that domain). Applies to both mailto links and plain-text addresses."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_LOG_TIMING_LABEL="Log processing time"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_LOG_TIMING_DESC="When enabled, the plugin writes a line to logs/plg_system_fgemailremover.php on every page load with the processing time (ms), HTML size before/after, and the URL. Intended for temporary performance diagnostics only - turn it back off on higher-traffic production sites once done, so the log doesn't grow unnecessarily."
