PLG_SYSTEM_FGEMAILREMOVER_FIELD_REPLACEMENT_LABEL="Náhradný text"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_LABEL="Spôsob náhrady"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_DESC="Text - adresa sa nahradí textom/HTML z poľa nižšie. Obrázok - adresa sa vykreslí ako PNG obrázok (vyžaduje GD na serveri; ak GD chýba alebo generovanie zlyhá, automaticky sa použije textový režim)."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_TEXT="Text"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_MODE_IMAGE="Obrázok (PNG)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_IMAGE_CLASS_LABEL="CSS trieda obrázka"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_IMAGE_CLASS_DESC="CSS trieda(y) pridané na vygenerovaný <img> tag (oddelené medzerou), napr. na potlačenie predvoleného tieňovania obrázkov v šablóne. Necháte-li prázdne, použije sa len interná trieda emailremover-img."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_PATH_LABEL="Cesta k TTF fontu"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_PATH_DESC="Cesta k .ttf/.otf súboru (nahratému napr. cez Media Manager), napr. /media/fonts/Poppins-Regular.ttf - obrázok sa vykreslí týmto fontom namiesto predvoleného. Necháte-li prázdne (alebo súbor neexistuje, alebo GD nemá freetype), použije sa vstavaný jednoduchý font."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_SIZE_LABEL="Veľkosť písma (pri TTF fonte)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_FONT_SIZE_DESC="Veľkosť písma v bodoch, používa sa len ak je vyplnená cesta k TTF fontu vyššie."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_REPLACEMENT_DESC="Text (môže obsahovať aj HTML), ktorým sa nahradí odstránená emailová adresa - platí pre mailto odkazy aj pre adresy v čistom texte. Necháte-li prázdne, adresa sa jednoducho odstráni bez náhrady."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_IMAGE_ALT_LABEL="Alt text obrázka"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_IMAGE_ALT_DESC="Text pre atribút alt vygenerovaného obrázka (napr. pre čítačky obrazovky). Adresu samú doň nedávajte, inak by ochrana strácala zmysel. Necháte-li prázdne, použije sa všeobecný text 'E-mailová adresa'."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_WHITELIST_LABEL="Výnimky (adresy, ktoré sa nemajú odstrániť)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_WHITELIST_DESC="Zoznam emailových adries alebo celých domén, ktoré má plugin ponechať bez zmeny - jedna položka na riadok (alebo oddelené čiarkou). Konkrétna adresa: napr. gdpr@fnspza.sk. Celá doména: @fnspza.sk (ponechá všetky adresy na tejto doméne). Platí rovnako pre mailto odkazy aj adresy v čistom texte."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_LOG_TIMING_LABEL="Zaznamenávať čas spracovania"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_LOG_TIMING_DESC="Ak zapnuté, plugin si pri každom načítaní stránky zapíše do logu logs/plg_system_fgemailremover.php čas spracovania (v ms), veľkosť HTML pred/po a URL adresu. Určené len na dočasnú diagnostiku výkonu - na produkcii s vyššou návštevnosťou to po odmeraní opäť vypnite, aby log zbytočne nerástol."
PLG_SYSTEM_FGEMAILREMOVER_FIELD_AUDIT_MODE_LABEL="Auditný režim (adresy v script/style)"
PLG_SYSTEM_FGEMAILREMOVER_FIELD_AUDIT_MODE_DESC="Plugin zámerne nezasahuje do obsahu <script> a <style> blokov (riziko poškodenia JS/CSS kódu by prevážilo prínos) - viac v README, časť Rozsah ochrany. Keď je táto voľba zapnutá, plugin len zapíše upozornenie do logu logs/plg_system_fgemailremover_audit.php, ak v takomto bloku nájde niečo vyzerajúce ako emailová adresa - obsah samotný nijako nemení, len vás na to upozorní, aby ste to prípadne vyriešili ručne priamo v šablóne/kóde."
